<!-- Socials Component -->
<!-- Usage: load_socials(modifier) where modifier is e.g. ' socials--lg'.
     Single source of truth for the social icon row - used by the footer, the
     landing hero and the mobile burger menu. Add a new icon here once and it
     appears in all of them. -->
<div class="socials{modifier}">
    <a href="https://github.com/MrStrenggeheim" class="socials__link" aria-label="GitHub" target="_blank"
        rel="noopener">
        <svg>
            <use href="/assets/icons.svg#icon-github"></use>
        </svg>
    </a>
    <a href="https://linkedin.com/in/florian-hunecke" class="socials__link" aria-label="LinkedIn" target="_blank"
        rel="noopener">
        <svg>
            <use href="/assets/icons.svg#icon-linkedin"></use>
        </svg>
    </a>
    <a href="/bufo/" class="socials__link" aria-label="Bufo library" title="Find a Bufo">
        <svg>
            <use href="/assets/icons.svg#icon-bufo"></use>
        </svg>
    </a>
</div>
