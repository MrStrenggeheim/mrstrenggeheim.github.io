<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>From pull request to production — Walk With Me</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/article-demo.css">
  <style>
    :root { --ci-inactive-opacity: .4; --ci-edge-width: 2; --ci-svg-font-size: 14px; --ci-note-font-size: 12px; --ci-label-halo: 4px; }
    .demo-header h1 { margin-right: auto; font-family: var(--font-mono); font-size: var(--font-size-base); }
    .modes { display: flex; gap: var(--space-xs); }
    #trigger { color: var(--text-muted); font: var(--font-size-xs) var(--font-mono); margin-bottom: var(--space-md); }
    .ci-graph-svg { display: block; width: 100%; height: auto; margin-inline: auto; overflow: visible; font: var(--ci-svg-font-size) Arial, sans-serif; }
    .ci-graph-svg .node rect { fill: var(--bg-primary); stroke: var(--border); }
    .ci-graph-svg .node text { fill: var(--text-primary); text-anchor: middle; }
    .ci-graph-svg .node.is-active rect { stroke: var(--demo-green); }
    .ci-graph-svg .node.is-skipped { opacity: var(--ci-inactive-opacity); }
    .ci-graph-svg .flowchart-link { fill: none; stroke: var(--text-muted); stroke-width: var(--ci-edge-width); }
    .ci-graph-svg .flowchart-link.is-active { stroke: var(--demo-green); }
    .ci-graph-svg .flowchart-link.is-skipped, .ci-graph-svg .ci-artifact.is-skipped { opacity: var(--ci-inactive-opacity); }
    .ci-graph-svg .ci-return { stroke-dasharray: 5 5; }
    .ci-marker-active path { fill: var(--demo-green); stroke: var(--demo-green); }
    .ci-marker-skipped path { fill: var(--text-muted); stroke: var(--text-muted); }
    .ci-artifact { font: var(--ci-note-font-size) var(--font-mono); fill: var(--text-secondary); paint-order: stroke; stroke: var(--bg-secondary); stroke-width: var(--ci-label-halo); stroke-linejoin: round; }
    .ci-artifact.is-active { fill: var(--demo-green); }
    .ci-mobile { display: none; }
    #deployment-note { margin-top: var(--space-md); font-size: var(--font-size-sm); color: var(--text-secondary); }
    @media (max-width: 640px) {
      .ci-wide { display: none; }
      [data-mode="pr"] .ci-mobile-pr, [data-mode="main"] .ci-mobile-main { display: block; }
      .demo-header { flex-wrap: wrap; }
      .modes { order: 1; flex-basis: 100%; }
      .modes button { flex: 1; }
    }
  </style>
</head>

  <div class="demo-header">
    <h1>ci.yml</h1>

      <button class="demo-button" type="button" data-ci-mode="main" aria-pressed="false">main</button>
    </div>
    <button type="button" class="demo-reset" id="reset" data-demo-reset aria-label="Reset to pull request" title="Reset to pull request"></button>
  </div>
  <p id="trigger">on: pull_request</p>
